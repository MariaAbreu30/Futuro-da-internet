
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#180d2b">
    <link rel="stylesheet" href="style.css">
    <title>Conectados ao Futuro — 2050</title>
</head>
<body>

    <div class="caixa-principal">

        <div class="etiqueta">✦ PROJETO FUTURO 2050 ✦</div>

        <h1>Conectados ao Futuro</h1>

        <p class="subtitulo">
            Suas escolhas de hoje podem transformar o mundo de amanhã.
        </p>

        <div class="linha-decorativa"></div>

        <div class="progresso">
            <span class="texto-progresso">Sua jornada</span>
            <span class="numero-progresso">1 de 5</span>
        </div>

        <div class="barra-progresso">
            <div class="barra-preenchida"></div>
        </div>

        <div class="caixa-perguntas"></div>

        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <h2 class="titulo-resultado"></h2>
            <p class="texto-resultado"></p>
            <button class="botao-reiniciar">Viver outra realidade ↻</button>
        </div>

        <div class="rodape">
            <span>UMA ESCOLHA PODE MUDAR TUDO</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
